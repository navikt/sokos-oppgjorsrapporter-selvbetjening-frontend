version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.READER_TOKEN }}
updates:
  - package-ecosystem: "npm"
    directory: "/"
    registries: "*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Oslo"
    groups:
      aksel:
        patterns:
          - "@navikt/aksel*"
          - "@navikt/ds*"
      react:
        patterns:
          - "react"
          - "react-dom"
      astro:
        patterns:
          - "astro"
      all-minor-updates:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@navikt/aksel-*"
          - "@navikt/ds-*"
          - "react"
          - "react-dom"
          - "astro"

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Oslo"
    groups:
      all-minor-updates:
        update-types:
          - "minor"
          - "patch"
